name: "CLI bug"
description: "Something in CLI does not work as documented"
title: "[CLI] "
type: Bug
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong? Paste the exact output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest steps or program that shows the problem.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: cmd
    attributes:
      label: Command
      options:
        - turf new
        - turf build
        - turf run
        - turf test
        - turf fmt
        - dependencies / turf.lock
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `turf --version` (or `turfc --version`).
      placeholder: 2.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
